<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>

<a href="Describe.dc.html" style="min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid #2A3D42; background: #172529; display: flex; align-items: center; font-size: 15px; font-weight: 700;">Edit</a>

<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #fb8b24;">
<svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h14v14H6a2 2 0 0 0-2 2a2 2 0 0 0 2 2h14"></path></svg>
20 min a day · reminder 21:30
</span>
<h1 style="margin: 0; font-family: 'Unbounded', system-ui, sans-serif; font-size: 34px; font-weight: 700;">Read</h1>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #2A3D42; border: 1px solid #2A3D42; border-radius: 20px; overflow: hidden;">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; background: #172529;">

<span style="font-family: 'Unbounded', system-ui, sans-serif; font-size: 24px; font-weight: 600; color: #fb8b24; font-variant-numeric: tabular-nums;">21</span>
<span style="font-size: 12px; color: #9FB0B4;">days · best 34</span>

<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; background: #172529;">
<span style="font-size: 12px; font-weight: 600; color: #9FB0B4;">Hit rate</span>

</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; background: #172529;">
<span style="font-size: 12px; font-weight: 600; color: #9FB0B4;">Avg day</span>
<span style="font-family: 'Unbounded', system-ui, sans-serif; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums;">{{avg}}</span>
<span style="font-size: 12px; color: #9FB0B4;">minutes</span>
</div>
</div>

<section aria-label="Last 18 weeks" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #172529; border: 1px solid #2A3D42; border-radius: 22px;">
<div style="display: flex; align-items: baseline; justify-content: space-between;">
<h2 style="margin: 0; font-size: 15px; font-weight: 700;">Last 18 weeks</h2>
<span style="font-size: 12px; color: #9FB0B4;">May – Sep</span>
</div>
<div style="display: flex; gap: 8px;">
<div aria-hidden="true" style="display: grid; grid-template-rows: repeat(7, 13px); gap: 3px; font-size: 10px; font-weight: 600; color: #7F9195;">
<span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span>S</span>
</div>

<sc-for list="{{cells}}" as="c" hint-placeholder-count="126">
<span style="width: 13px; height: 13px; border-radius: 3px; background: {{c.bg}};"></span>
</sc-for>
</div>
</div>
<div aria-hidden="true" style="display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 11px; color: #9FB0B4;">
<span style="margin-right: 4px;">Less</span>
<span style="width: 11px; height: 11px; border-radius: 3px; background: #22363B;"></span>
<span style="width: 11px; height: 11px; border-radius: 3px; background: rgba(251,139,36,0.35);"></span>
<span style="width: 11px; height: 11px; border-radius: 3px; background: rgba(251,139,36,0.65);"></span>
<span style="width: 11px; height: 11px; border-radius: 3px; background: #fb8b24;"></span>

<section aria-label="Notes" style="display: flex; flex-direction: column; gap: 8px;">
<h2 style="margin: 0; padding: 0 4px; font-size: 15px; font-weight: 700;">Notes</h2>
<div style="display: flex; flex-direction: column; background: #172529; border: 1px solid #2A3D42; border-radius: 20px;">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 16px;">
<span style="font-size: 12px; font-weight: 600; color: #9FB0B4;">Thu 24 Sep · 30 min</span>
<span style="font-size: 15px;">Finished part two.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-top: 1px solid #2A3D42;">
<span style="font-size: 12px; font-weight: 600; color: #9FB0B4;">Mon 21 Sep · 20 min</span>
<span style="font-size: 15px;">Started a new book.</span>
</div>
</div>
</section>

<button type="button" style="min-height: 52px; border-radius: 18px; border: 1px dashed #6E8186; background: transparent; color: #F3EEE8; font-size: 15px; font-weight: 700; cursor: pointer;">Pause habit · keeps your streak</button>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    // 18 weeks x 7 days, column per week, Monday first; today is the Friday of the last week.
    let seed = 7;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const cells = [];
    let hit = 0, due = 0, mins = 0;
    for (let w = 0; w < 18; w++) {
      for (let d = 0; d < 7; d++) {
        const last = w === 17;
        let m;
        if (last && d > 4) { cells.push({ bg: 'transparent' }); continue; }
        if (last && d === 4) m = 10;
        else if (w * 7 + d >= 102) m = 20 + Math.round(rnd() * 15); // current 21-day streak
        else if (w * 7 + d === 101) m = 0;
        else m = rnd() < 0.18 ? 0 : 12 + Math.round(rnd() * 28);
        due++; mins += m; if (m >= 20) hit++;
        const bg = m === 0 ? '#22363B' : m < 20 ? 'rgba(251,139,36,0.35)' : m < 30 ? 'rgba(251,139,36,0.65)' : '#fb8b24';
        cells.push({ bg });
      }
    }
    const rate = Math.round(hit / due * 100);
    return { cells, rate, avg: Math.round(mins / due), heatLabel: 'Reading goal hit on ' + hit + ' of ' + due + ' days' };
  }
}
</script>
