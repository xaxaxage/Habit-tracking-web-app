<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Habit options</title>
<script src="f432e745-1d39-4e24-be2b-9e90b6cd0a1c"></script>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif;background:#0E1A1D;color:#F3EEE8}
button,input,textarea{font:inherit;color:inherit}
textarea::placeholder{color:#7F9195}
a{color:#F3EEE8;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0E1A1D; font-family: 'Onest', system-ui, sans-serif; color: #F3EEE8;">

<div aria-hidden="true" style="position: absolute; inset: 0; padding: 206px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 140px; gap: 12px; opacity: 0.35;">
<span style="border-radius: 24px; background: #0f4c5c;"></span>
<span style="border-radius: 24px; background: #5f0f40;"></span>
<span style="border-radius: 24px; background: #172529; border: 1.5px solid #9a031e;"></span>
<span style="border-radius: 24px; background: #172529; border: 1.5px solid #2A3D42;"></span>
</div>
<a href="Board.dc.html" aria-label="Close options" style="position: absolute; inset: 0; background: rgba(5, 12, 14, 0.6);"></a>

<section role="dialog" aria-label="Workout options" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 34px; background: #172529; border-top: 1px solid #2A3D42; border-radius: 30px 30px 0 0; display: flex; flex-direction: column; gap: 18px;">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #3A4F55;"></span>

<div style="display: flex; align-items: center; gap: 14px;">
<span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #9a031e; color: #FFFFFF;">
<svg width="26" height="26" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>
</span>
<div style="display: flex; flex-direction: column; gap: 2px;">
<h2 style="margin: 0; font-family: 'Unbounded', system-ui, sans-serif; font-size: 22px; font-weight: 700;">Workout</h2>
<span style="font-size: 14px; color: #9FB0B4;">{{status}}</span>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<button type="button" sc-camel-on-click="{{toggleDone}}" aria-pressed="{{done}}" style="{{doneStyle}}">
<svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span style="font-size: 15px; font-weight: 700;">{{doneLabel}}</span>
</button>
<button type="button" sc-camel-on-click="{{toggleSkip}}" aria-pressed="{{skipped}}" style="{{skipStyle}}">
<svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
<span style="display: flex; flex-direction: column; gap: 1px; text-align: left;"><span style="font-size: 15px; font-weight: 700;">{{skipLabel}}</span><span style="font-size: 12px; opacity: 0.8;">Streak stays</span></span>
</button>
<a href="Week.dc.html" style="min-height: 64px; box-sizing: border-box; padding: 0 16px; border-radius: 18px; display: flex; align-items: center; gap: 10px; background: #22363B; border: 1px solid #2A3D42; color: #F3EEE8; font-size: 15px; font-weight: 700;">
<svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
Log another day
</a>
<a href="HabitHistory.dc.html" style="min-height: 64px; box-sizing: border-box; padding: 0 16px; border-radius: 18px; display: flex; align-items: center; gap: 10px; background: #22363B; border: 1px solid #2A3D42; color: #F3EEE8; font-size: 15px; font-weight: 700;">
<svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"></path></svg>
History &amp; stats
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="note" style="font-size: 14px; font-weight: 700;">Note for today</label>
<textarea id="note" rows="2" placeholder="How did it go?" sc-camel-on-change="{{onNote}}" value="{{note}}" style="box-sizing: border-box; width: 100%; min-height: 76px; resize: none; padding: 12px 14px; border-radius: 16px; border: 1px solid #3A4F55; background: #0E1A1D; font-size: 16px; line-height: 1.4; outline: none;"></textarea>
</div>

<a href="Board.dc.html" style="height: 56px; border-radius: 18px; background: #F3EEE8; color: #0E1A1D; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700;">Save</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: true, skipped: false, note: 'Legs and core, 45 min' };
  }
  renderVals() {
    const { done, skipped, note } = this.state;
    const tile = 'min-height: 64px; box-sizing: border-box; padding: 0 16px; border-radius: 18px; display: flex; align-items: center; gap: 10px; cursor: pointer; ';
    const weekCount = 2 + (done ? 1 : 0);
    return {
      done, skipped, note,
      status: weekCount + ' of 4 this week · ' + (skipped ? 'skipped today' : done ? 'done today' : 'not done yet'),
      doneLabel: done ? 'Done today' : 'Mark done',
      skipLabel: skipped ? 'Skipped' : 'Skip today',
      doneStyle: tile + (done ? 'background: #9a031e; border: 1px solid #9a031e; color: #FFFFFF;' : 'background: #22363B; border: 1px solid #2A3D42; color: #F3EEE8;'),
      skipStyle: tile + (skipped ? 'background: #F3EEE8; border: 1px solid #F3EEE8; color: #0E1A1D;' : 'background: #22363B; border: 1px dashed #6E8186; color: #F3EEE8;'),
      toggleDone: () => this.setState({ done: !done, skipped: false }),
      toggleSkip: () => this.setState({ skipped: !skipped, done: false }),
      onNote: (e) => this.setState({ note: e.target.value })
    };
  }
}
</script>


</body></html>
