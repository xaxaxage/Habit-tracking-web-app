name: Test and deploy

on:
  push:
    branches: [main, claude/eager-knuth-uzpp19]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the Claude Desktop extension with the official mcpb tool
        run: |
          mkdir -p "$RUNNER_TEMP/mcpb/ext"
          cd "$RUNNER_TEMP/mcpb"
          npm install --no-save --silent @anthropic-ai/mcpb@2
          cd ext
          unzip -q "$GITHUB_WORKSPACE/dist/mcp/habit-tracker.mcpb"
          ../node_modules/.bin/mcpb validate manifest.json
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # Needs GitHub Pages turned on once: Settings → Pages → Source: GitHub Actions.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
